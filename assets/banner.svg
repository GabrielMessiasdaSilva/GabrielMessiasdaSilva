  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p { fill: #00D9FF; font-size: 18px; font-weight: 700; animation: show .01s both; }
    .c { fill: #8b949e; font-size: 18px; }
    .o { fill: #e6edf3; }
    .r { width: var(--w); animation: type var(--d) steps(var(--n), end) var(--t) both; }
    .r1 { --w: 80px;  --d: .5s;  --n: 6;  --t: .5s;  }
    .r2 { --w: 420px; --d: 1.2s; --n: 24; --t: 1.1s; }
    .r3 { --w: 170px; --d: .8s;  --n: 14; --t: 2.5s; }
    .r4 { --w: 510px; --d: 1.6s; --n: 41; --t: 3.4s; }
    .r5 { --w: 200px; --d: .9s;  --n: 17; --t: 5.2s; }
    .r6 { --w: 560px; --d: 1.8s; --n: 50; --t: 6.2s; }
    .r7 { --w: 80px;  --d: .4s;  --n: 6;  --t: 8.2s; }
    .r8 { --w: 540px; --d: 1.4s; --n: 43; --t: 8.7s; }
    .p2 { animation-delay: 2.4s; } .p3 { animation-delay: 5.1s; } .p4 { animation-delay: 8.1s; } .p5 { animation-delay: 10.2s; }
    .cur { fill: #00D9FF; animation: show .01s 10.2s both, blink 1s steps(1) 10.2s infinite; }
    @keyframes type { from { width: 0; } }
    @keyframes show { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

