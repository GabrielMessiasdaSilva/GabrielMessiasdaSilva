<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Messias da Silva</title>
  <desc id="desc">Desenvolvedor Full Stack com foco em Java, Quarkus e Angular.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#087bff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#087bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#5d7ca8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <ellipse cx="950" cy="130" rx="360" ry="260" fill="url(#glow)"/>
  <path d="M64 72v156" stroke="#1685ff" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="132" fill="#f2f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Gabriel Messias da Silva</text>
  <text x="98" y="177" fill="#78b7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="3">DESENVOLVEDOR FULL STACK</text>
  <text x="98" y="222" fill="#aab7ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Java <tspan fill="#1685ff">/</tspan> Quarkus <tspan fill="#1685ff">/</tspan> Angular <tspan fill="#1685ff">/</tspan> TypeScript</text>
  <circle cx="1100" cy="90" r="4" fill="#2b91ff"/>
  <circle cx="1130" cy="90" r="4" fill="#2b91ff" fill-opacity=".55"/>
  <circle cx="1160" cy="90" r="4" fill="#2b91ff" fill-opacity=".25"/>
</svg>
